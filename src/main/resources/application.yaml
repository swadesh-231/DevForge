spring:
  application:
    name: DevForge

  datasource:
    url: ${DB_URL}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: devforge
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cookie:
    refresh-token-name: devforge_refresh_token
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: /api/auth
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

imagekit:
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}
  avatar-folder: /devforge/avatars
  max-avatar-bytes: 2097152
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/webp
